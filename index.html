<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MIDNIGHT · Escrow + Track AI</title>
  <link href="styles.css" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="root" class="app hidden">
    <header class="header glass">
      <div class="brand">
        <div class="logo-blob"></div>
        <div class="titles"><h1>MIDNIGHT</h1><span class="sub">escrow · track-ai</span></div>
      </div>
      <div class="user-chip" id="user-chip">...</div>
    </header>

    <main class="content">
      <section id="page-deal" class="page active">
        <h2>Создать сделку</h2>
        <div class="card">
          <div class="row">
            <label class="field"><span>Сумма</span><input id="amount" type="number" step="0.01" placeholder="1500" /></label>
            <label class="field"><span>Метод</span><select id="method"><option value="ton">TON</option><option value="sbp">RUB</option><option value="stars">Telegram Stars</option></select></label>
          </div>
          <label class="field"><span>Описание</span><textarea id="descr" rows="3" placeholder="Что продаёте/покупаете..."></textarea></label>
          <button id="create-deal" class="btn primary w100">Создать</button>
        </div>
        <p class="hint">Ссылка для покупателя придёт в чат.</p>
      </section>

      <section id="page-trackai" class="page"></section>

      <section id="page-wallets" class="page">
        <h2>Кошельки</h2>
        <div class="card">
          <label class="field"><span>TON</span><input id="ton" type="text" placeholder="UQ... или EQ..." /></label>
          <label class="field"><span>Карта/СБП</span><input id="card" type="text" placeholder="Банк + 4 цифры" /></label>
          <div class="row"><button id="save-ton" class="btn ghost w100">Сохранить TON</button><button id="save-card" class="btn ghost w100">Сохранить карту</button></div>
        </div>
      </section>

      <section id="page-ref" class="page">
        <h2>Рефералка</h2>
        <div class="card center"><button id="get-ref" class="btn primary">Получить ссылку</button><p class="muted">Персональная ссылка придёт в чат.</p></div>
      </section>

      <section id="page-profile" class="page">
        <h2>Профиль</h2>
        <div class="card"><div class="profile"><div class="avatar" id="avatar"></div><div class="meta"><div id="name">—</div><div id="uid" class="muted">—</div></div></div><button id="close-app" class="btn ghost w100">Закрыть</button></div>
      </section>

      <section id="page-lang" class="page">
        <h2>Язык</h2>
        <div class="card row"><button class="btn ghost w100" data-lang="ru">Русский</button><button class="btn ghost w100" data-lang="en">English</button></div>
      </section>

      <section id="page-help" class="page"><h2>Поддержка</h2><div class="card center"><a id="support" class="btn primary" href="#" target="_blank">Открыть поддержку</a></div></section>
    </main>

    <nav class="tabs glass">
      <button class="tab active" data-page="deal">🧾<span>Сделка</span></button>
      <button class="tab" data-page="trackai">🎧<span>Track AI</span></button>
      <button class="tab" data-page="wallets">💳<span>Кошельки</span></button>
      <button class="tab" data-page="ref">🧲<span>Реф</span></button>
      <button class="tab" data-page="profile">👤<span>Профиль</span></button>
      <button class="tab" data-page="help">🛟<span>Помощь</span></button>
    </nav>
  </div>

  <div id="gate" class="gate">
    <div class="loader"><div class="ring"></div><div class="text">MIDNIGHT</div><div class="note">загрузка…</div></div>
  </div>

  <script src="track-ai.js"></script>
  <script src="script.js"></script>
</body>
</html>
